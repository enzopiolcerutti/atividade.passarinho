<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <title>Exercício do Pássaro</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0; 
        }
    </style>
</head>
<body>

<script>
// Configuração do jogo Phaser
var config = { 
        type: Phaser.AUTO,
        width: 800,
        height: 600,

        scene: {
            preload: preload,
            create: create,
            update: update
        }
    };

    //Criação do jogo Phaser
    var game = new Phaser.Game(config);

    var passarinho; // Variável para o sprite do passarinho

    //Variáveis para controlar o movimento do passarinho
    let ida = true;
    let subida = false; 
    
    // Função para carregar os assets do jogo
    function preload() {
        this.load.image('bg', 'assets/bg_space.png'); // Carrega a imagem de fundo
        this.load.spritesheet('bird', 'assets/bird-red.png', { frameWidth: 75, frameHeight: 75 }); // Carrega o spritesheet do passarinho
    }

    // Função para criar os elementos do jogo
    function create() {
        this.add.image(400, 300, 'bg').setScale(1.2); // Adiciona a imagem de fundo
        passarinho = this.add.sprite(100, 300, 'bird').setScale(1.3); // Adiciona o sprite do passarinho
        
        // Cria a animação de voo do passarinho
        this.anims.create({
            key: 'fly',
            frames: this.anims.generateFrameNumbers('bird', { start: 0, end: 7}),
            frameRate: 10,
            repeat: -1
        });
        
        passarinho.anims.play('fly', true); // Inicia a animação de voo
    }

    // Função de atualização do jogo, chamada a cada frame
    function update() {   
        // Movimento no eixo X (horizontal)
        while (passarinho.x < 700 && ida) {
            passarinho.x += 2;  // Mover o passarinho para a direita
            break;
        }
        if (passarinho.x >= 700 && ida) {
            passarinho.setFlip(true, false); // Inverte a direção do sprite para a esquerda
            ida = false;
        }
        while (passarinho.x > 100 && !ida) {
            passarinho.x -= 2;  // Mover o passarinho para a esquerda
            break;
        }
        if (passarinho.x <= 100 && !ida) {
            passarinho.setFlip(false, false); // Define a direção do sprite para a direita
            ida = true;
        }

        // Movimento no eixo Y (vertical)
        if (passarinho.y <= 100) {
            subida = false; // Define que o passarinho deve descer
        }

        if (subida) {
            passarinho.y -= 2; // Move o passarinho para cima
        }

        if (!subida && passarinho.y < 600) {
            passarinho.y += 2; // Move o passarinho para baixo
        }

        if (passarinho.y >= 600) {
            subida = true;  // Define que o passarinho deve subir quando alcançar o limite inferior
        }
    }

</script>

</body>
</html>
